<!-- Mockup aprovado: Dashboard — Grid de cards -->
<div style="background: #0d1117; border-radius: 8px; padding: 20px; min-height: 340px; display: flex; flex-direction: column; gap: 12px;">
  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #161b22; border-radius: 8px;">
    <span style="font-size: 13px; font-weight: 600; background: linear-gradient(to right, #818cf8, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GitPulse</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 20px; height: 20px; background: #374151; border-radius: 50%;"></div>
      <span style="font-size: 10px; color: #9ca3af;">Sair</span>
    </div>
  </div>
  <!-- Title row -->
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 15px; font-weight: 600; color: #e5e7eb;">Seus repositórios</div>
      <div style="font-size: 11px; color: #6b7280;">3 observados</div>
    </div>
    <div style="background: #4f46e5; color: white; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 500;">+ Adicionar</div>
  </div>
  <!-- Grid cards -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
    <div style="background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; font-weight: 600; color: #e5e7eb;">lucamandelli/gitpulse</span>
        <span style="font-size: 10px; color: #6b7280; cursor: pointer;">✕</span>
      </div>
      <a style="font-size: 10px; color: #818cf8; text-decoration: none;">↗ Ver no GitHub</a>
      <div style="font-size: 10px; color: #4b5563; border-top: 1px solid #21262d; padding-top: 6px; margin-top: 4px;">Adicionado há 2 dias</div>
    </div>
    <div style="background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; font-weight: 600; color: #e5e7eb;">facebook/react</span>
        <span style="font-size: 10px; color: #6b7280; cursor: pointer;">✕</span>
      </div>
      <a style="font-size: 10px; color: #818cf8; text-decoration: none;">↗ Ver no GitHub</a>
      <div style="font-size: 10px; color: #4b5563; border-top: 1px solid #21262d; padding-top: 6px; margin-top: 4px;">Adicionado há 1 dia</div>
    </div>
    <div style="background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; font-weight: 600; color: #e5e7eb;">vercel/next.js</span>
        <span style="font-size: 10px; color: #6b7280; cursor: pointer;">✕</span>
      </div>
      <a style="font-size: 10px; color: #818cf8; text-decoration: none;">↗ Ver no GitHub</a>
      <div style="font-size: 10px; color: #4b5563; border-top: 1px solid #21262d; padding-top: 6px; margin-top: 4px;">Adicionado agora</div>
    </div>
  </div>
</div>
