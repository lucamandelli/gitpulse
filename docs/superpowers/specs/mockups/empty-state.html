<!-- Mockup aprovado: Empty State — Welcome + placeholder cards -->
<div style="background: #0d1117; border-radius: 8px; padding: 32px; min-height: 280px; display: flex; flex-direction: column; gap: 16px;">
  <!-- Header -->
  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #161b22; border-radius: 8px;">
    <span style="font-size: 14px; font-weight: 600; background: linear-gradient(to right, #818cf8, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GitPulse</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 24px; height: 24px; background: #374151; border-radius: 50%;"></div>
      <span style="font-size: 11px; color: #9ca3af;">Sair</span>
    </div>
  </div>
  <!-- Welcome -->
  <div>
    <div style="font-size: 18px; font-weight: 600; color: #e5e7eb;">Bem-vindo, Luca!</div>
    <div style="font-size: 13px; color: #6b7280; margin-top: 4px;">Seus repositórios e resumos aparecerão aqui.</div>
  </div>
  <!-- Dashed CTA card -->
  <div style="border: 2px dashed #374151; border-radius: 12px; padding: 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="font-size: 14px; color: #9ca3af;">Comece adicionando um repositório</div>
    <div style="background: #4f46e5; color: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;">+ Adicionar repositório</div>
  </div>
  <!-- Ghost cards -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; opacity: 0.3;">
    <div style="background: #161b22; border-radius: 8px; padding: 16px; height: 60px;"></div>
    <div style="background: #161b22; border-radius: 8px; padding: 16px; height: 60px;"></div>
  </div>
</div>
